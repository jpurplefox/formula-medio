AWSTemplateFormatVersion: '2010-09-09'
# What Fórmula ½ needs on AWS, all at once (docs/deployment.md):
# - a private S3 bucket with the game files;
# - a CloudFront distribution in front, the only thing that can read the bucket (Origin Access Control);
# - a role that GitHub Actions assumes with OIDC to publish from main (no AWS keys stored in GitHub).
Description: Formula 1/2 - static site (S3 + CloudFront) and deploy role for GitHub Actions

Parameters:
  BucketName:
    Type: String
    Default: formula-medio
    Description: Bucket name (unique across all of S3)
  GitHubSubjectPrefix:
    Type: String
    Default: repo:jpurplefox@9813325/formula-medio@1453280176
    Description: >-
      How the repo that may publish identifies itself (the sub of the GitHub token without the branch). New repos use
      the format with IDs, which does not change if the repo is renamed; it comes from
      gh api repos/OWNER/REPO/actions/oidc/customization/sub (sub_claim_prefix)
  GitHubOIDCProviderArn:
    Type: String
    Default: ''
    Description: >-
      ARN of the GitHub OIDC provider if the account already has one (for example, sleepmon's). Empty creates it.
      An account can have only one per URL, so if it already exists it must be passed in.

Conditions:
  CreateOIDCProvider: !Equals [!Ref GitHubOIDCProviderArn, '']

Resources:
  Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref BucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Ref BucketName
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Formula 1/2
        DefaultRootObject: index.html
        HttpVersion: http2and3
        # all regions: PriceClass_100 has no edge locations in South America
        PriceClass: PriceClass_All
        Origins:
          - Id: s3
            DomainName: !GetAtt Bucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: s3
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          # Managed-CachingOptimized: compresses with gzip and brotli (the rivals' network, 1.2 MB of JSON, shrinks
          # a lot)
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          Compress: true

  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Bucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: SoloCloudFront
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${Bucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList: [6938fd4d98bab03faadb97b34396831e3780aea1]

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${BucketName}-deploy'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If [CreateOIDCProvider, !Ref GitHubOIDCProvider, !Ref GitHubOIDCProviderArn]
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # only what runs on main in this repo
                token.actions.githubusercontent.com:sub: !Sub '${GitHubSubjectPrefix}:ref:refs/heads/main'
      Policies:
        - PolicyName: publicar
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt Bucket.Arn
              - Effect: Allow
                Action: [s3:PutObject, s3:DeleteObject]
                Resource: !Sub '${Bucket.Arn}/*'
              - Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

Outputs:
  SiteUrl:
    Description: Where the game lives
    Value: !Sub 'https://${Distribution.DomainName}'
  DistributionId:
    Description: For the CLOUDFRONT_DISTRIBUTION_ID secret
    Value: !Ref Distribution
  DeployRoleArn:
    Description: For the AWS_ROLE_ARN secret
    Value: !GetAtt DeployRole.Arn
