<!doctype html>
<meta charset="utf-8">
<title>Export tracks</title>
<!-- Builds the mask of each track (the part that needs the browser) and saves it in rl/tracks/, so the training
     environment can build the tracks in Node. Open with serve.py running. -->
<pre id="log">Exporting…</pre>
<script type="module">
  import { TRACKS } from '../tracks/index.js';
  import { imageMask, loadImage } from '../src/load/trackimage.js';
  import { packMask } from './mask.js';

  const log = document.getElementById('log');
  const lines = [];
  for (const def of TRACKS.filter((d) => d.image)) { // tracks built from telemetry don't need a mask
    const mask = imageMask(await loadImage('../' + def.image), def);
    const res = await fetch(`tracks/${def.id}.mask`, { method: 'PUT', body: packMask(mask) });
    lines.push(`${def.id}: ${mask.W}×${mask.H} ${res.ok ? 'ok' : 'error ' + res.status}`);
    log.textContent = lines.join('\n');
  }
  log.textContent += '\nDone';
</script>
