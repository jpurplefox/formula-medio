# Publishes the game to AWS (S3 + CloudFront) on every push to main. The infrastructure is in infra/aws.yml and the
# one-time steps in docs/deployment.md. There is no build: the files are uploaded as they are.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # to assume the AWS role with OIDC
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: sa-east-1
  S3_BUCKET: formula-medio

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # only what the game loads in the browser (rl/, tools/ and serve.py are left out)
      - name: Build the site
        run: tools/site.sh site

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # File names carry no hash, so the browser always has to ask whether they changed (no-cache: if they didn't,
      # the answer is an empty 304); that way nobody ends up with a new main.js and an old teams.js. The .webp files
      # go separately with their type, because not every CLI version knows it.
      - name: Upload to S3
        run: |
          aws s3 sync site/ "s3://$S3_BUCKET/" --delete --cache-control no-cache --exclude "*.webp"
          aws s3 sync site/ "s3://$S3_BUCKET/" --delete --cache-control no-cache --exclude "*" --include "*.webp" --content-type image/webp

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/*"
