# Checks every PR and every push to main: ESLint and Prettier (npm run lint), the tests (npm test, in test/) and the
# regression check (tools/regress.js), which runs races with a fixed seed and compares them with
# tools/regress.base.txt. If a change touches the physics, the AI or the sensors on purpose, update the baseline with
# node tools/regress.js save and commit it with the change.
name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  # On macOS with Apple Silicon (arm64), like the machine where the baseline is saved: on x64 the math functions
  # (Math.sin, Math.exp...) can differ in the last decimal and the race diverges.
  regress:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm run regress
